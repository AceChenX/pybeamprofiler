[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pybeamprofiler"
version = "0.3.0"
description = "Real-time laser beam profiler with Gaussian fitting for GenICam cameras"
readme = "README.md"
authors = [
  { name = "C.-A. Chen", email = "acechen@cirx.org" },
]
license = { file = "LICENSE" }
keywords = ["laser", "beam-profiling", "gaussian-fitting", "genicam", "flir", "basler", "camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "plotly",
    "dash[async]",
    "dash-bootstrap-components",
    "ipywidgets",
    "Pillow",
    "harvesters>=1.4.0",
]
requires-python = ">=3.10"

[project.urls]
"Homepage" = "https://github.com/acechenx/pybeamprofiler"
"Bug Tracker" = "https://github.com/acechenx/pybeamprofiler/issues"

[project.scripts]
pybeamprofiler = "pybeamprofiler.beamprofiler:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pybeamprofiler"]

[tool.uv]
# Override harvesters' ``genicam>=1.2`` dep per platform. The version
# constraints below are deliberately *disjoint* per platform: this forces
# uv's resolver to fork by marker rather than unifying to a single version
# (which would otherwise pin 1.5.0 globally and break Python 3.14 on
# Linux/Windows, where 1.5.0 has no cp314 wheel).
#
# * macOS Python <3.14: pin 1.5.0 — the last release with macOS wheels
#   (``macosx_13_0_arm64``, cp310–cp313). 1.5.1+ dropped all macOS wheels.
# * macOS Python 3.14+: no wheel exists for any genicam release on macOS.
#   No override matches; uv excludes genicam here and ``harvesters`` will
#   import-fail at runtime — handled gracefully by the package.
# * Linux / Windows: pin 1.5.1+ (the first release with cp314 wheels;
#   cp310–cp313 wheels for 1.5.1 still exist for older Pythons too).
override-dependencies = [
    "genicam==1.5.0 ; sys_platform == 'darwin' and python_version < '3.14'",
    "genicam>=1.5.1 ; sys_platform != 'darwin'",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
dev = [
    "pybeamprofiler[test]",
    "ruff>=0.15",
    "ty>=0.0.30",
    "pre-commit>=4.5",
]
matplotlib = [
    "matplotlib>=3.10",  # Optional fallback for command-line streaming
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pybeamprofiler --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pybeamprofiler"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# ``# ty: ignore[unresolved-import]`` directives in the source are needed on
# CI runners where optional camera SDKs (genicam, harvesters) aren't
# installed. With them installed locally, ty would otherwise complain about
# the directive being unused.
unused-ignore-comment = "ignore"
