name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # One run each on macOS and Windows, where the GenTL search paths and
        # the path-separator handling in cti.py differ from Linux.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v7

    # ``python-version`` makes setup-uv export UV_PYTHON, and that is what
    # selects the interpreter. Installing one with ``uv python install`` does
    # not: ``uv sync`` would still follow .python-version, so every job in the
    # matrix used to test 3.13.
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Check the interpreter
      run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}'), sys.version"

    - name: Lint with ruff
      run: uv run ruff check src tests

    - name: Format check with ruff
      run: uv run ruff format --check src tests

    - name: Type check with ty
      run: uv run ty check src tests

    - name: Test with pytest
      run: uv run pytest tests/ --cov=pybeamprofiler --cov-report=term-missing

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
      contents: read   # required for actions/checkout

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
